[project]
name = "one-health-puglia"
version = "0.1.0"
description = "One Health DSS for Puglia: ARPA ingestion, profiling and analytics"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0"
]

[project.scripts]
arpa = "etl.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["etl*", "app*"]
exclude = ["data*", "tests*"]
