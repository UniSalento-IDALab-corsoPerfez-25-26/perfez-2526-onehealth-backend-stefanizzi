services:

  environment-service:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - services.environment.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    environment:
      DATABASE_URL: ${ONEHEALTH_DATABASE_URL:?Impostare ONEHEALTH_DATABASE_URL}

    ports:
      - "8001:8000"

    volumes:
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

